name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and regenerate registry.json
        run: node scripts/validate.mjs --verify-files
      - name: registry.json must be committed
        run: git diff --exit-code registry.json
